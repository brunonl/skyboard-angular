name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 09:17 UTC
    # Supabase pauses after 7 days of inactivity - 3 days gives comfortable margin
    - cron: '17 9 */3 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REFS: "uuihxuerkwopjoeoervr"
    steps:
      - name: Validate Secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]    && MISSING="$MISSING SUPABASE_ACCESS_TOKEN"
          [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ] && MISSING="$MISSING SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$MISSING" ]; then
            echo "❌ Secrets ausentes:$MISSING"
            exit 1
          fi
          echo "✅ Secrets OK."

      - name: Ping Database & Keep Alive
        run: |
          OVERALL_SUCCESS=true

          for PROJECT_REF in $SUPABASE_PROJECT_REFS; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📦 Projeto: $PROJECT_REF"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # FIX #1: Build the URL directly from PROJECT_REF so it always matches the project being checked
            SUPABASE_REST_URL="https://${PROJECT_REF}.supabase.co"

            # Ping the REST API - generates activity and resets Supabase's inactivity timer
            echo "📡 Pingando banco para resetar timer de inatividade..."

            ping_http=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 20 \
              -X GET \
              "${SUPABASE_REST_URL}/rest/v1/" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Accept: application/json" || echo "000")

            echo "📡 Ping status: HTTP $ping_http"

            if [ "$ping_http" -ge 200 ] 2>/dev/null && [ "$ping_http" -lt 300 ] 2>/dev/null; then
              echo "✅ Banco respondendo! Timer de inatividade resetado."
              continue
            fi

            # FALLBACK: Ping failed - project might be paused. Check & restore.
            echo "⚠️ Ping falhou (HTTP $ping_http). Verificando status via Management API..."

            status_response=$(curl -s --max-time 30 \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF" || echo "{}")

            echo "📄 Resposta da API: $status_response"

            # FIX #2: Use jq for robust JSON parsing instead of fragile grep
            project_status=$(echo "$status_response" | jq -r '.status // empty')
            project_name=$(echo "$status_response"   | jq -r '.name   // empty')

            # Fallback to grep if jq is not available or returns empty
            if [ -z "$project_status" ]; then
              project_status=$(echo "$status_response" | grep -oP '"status"\s*:\s*"\K[^"]+' | head -1)
            fi
            if [ -z "$project_name" ]; then
              project_name=$(echo "$status_response" | grep -oP '"name"\s*:\s*"\K[^"]+' | head -1)
            fi

            echo "📌 Status: '$project_status' ($project_name)"

            if [ "$project_status" = "INACTIVE" ] || [ "$project_status" = "PAUSED" ]; then
              echo "🔄 Projeto pausado! Restaurando automaticamente..."

              # FIX #3: Add empty JSON body '{}' to the POST request (required by Supabase API)
              restore_response=$(curl -s -w "\n%{http_code}" \
                --max-time 60 \
                -X POST \
                -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
                -H "Content-Type: application/json" \
                -d '{}' \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/restore" || echo -e "{}\n000")

              restore_http=$(echo "$restore_response" | tail -1)
              restore_body=$(echo "$restore_response" | head -1)

              echo "📄 Resposta da restauração (HTTP $restore_http): $restore_body"

              if [ "$restore_http" -ge 200 ] 2>/dev/null && [ "$restore_http" -lt 300 ] 2>/dev/null; then
                echo "🚀 Restauração iniciada! (HTTP $restore_http)"
                echo "⏳ O projeto ficará ativo em poucos minutos."
                echo "   A próxima execução (em 3 dias) irá manter ativo via ping normal."
              else
                echo "❌ Falha na restauração! HTTP $restore_http"
                OVERALL_SUCCESS=false
              fi

            elif [ "$project_status" = "RESTORING" ] || [ "$project_status" = "COMING_UP" ]; then
              echo "⏳ Projeto em restauração ($project_status). Aguarde a próxima execução."
            elif [ "$project_status" = "ACTIVE_HEALTHY" ]; then
              echo "🔄 Projeto marcado como saudável, mas a API está indisponível. Reiniciando..."

              restart_response=$(curl -s -w "\n%{http_code}" \
                --max-time 60 \
                -X POST \
                -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/restart" || echo -e "{}\n000")

              restart_http=$(echo "$restart_response" | tail -1)
              restart_body=$(echo "$restart_response" | head -1)

              echo "📄 Resposta do reinício (HTTP $restart_http): $restart_body"

              if [ "$restart_http" -ge 200 ] 2>/dev/null && [ "$restart_http" -lt 300 ] 2>/dev/null; then
                echo "🚀 Reinício iniciado. Aguardando a API voltar..."
                DATABASE_READY=false

                for attempt in $(seq 1 20); do
                  sleep 15

                  recovery_http=$(curl -s -o /dev/null -w "%{http_code}" \
                    --max-time 20 \
                    -X GET \
                    "${SUPABASE_REST_URL}/rest/v1/" \
                    -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
                    -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
                    -H "Accept: application/json" || echo "000")

                  echo "⏳ Tentativa $attempt/20 após reinício: HTTP $recovery_http"

                  if [ "$recovery_http" -ge 200 ] 2>/dev/null && [ "$recovery_http" -lt 300 ] 2>/dev/null; then
                    DATABASE_READY=true
                    echo "✅ Banco disponível novamente."
                    break
                  fi
                done

                if [ "$DATABASE_READY" != "true" ]; then
                  echo "❌ O reinício foi aceito, mas a API não voltou dentro de 5 minutos."
                  OVERALL_SUCCESS=false
                fi
              else
                echo "❌ Falha ao reiniciar o projeto! HTTP $restart_http"
                OVERALL_SUCCESS=false
              fi
            elif [ -z "$project_status" ]; then
              echo "❌ Não foi possível obter o status. Resposta da API: $status_response"
              OVERALL_SUCCESS=false
            else
              echo "❌ Status inesperado: '$project_status'. Investigar manualmente."
              OVERALL_SUCCESS=false
            fi
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ "$OVERALL_SUCCESS" = "true" ]; then
            echo "✅ Concluído! $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          else
            echo "❌ Falhou. Verifique os logs acima."
            exit 1
          fi
